<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FaceMood Remote Control</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0f17;
      color: #e6edf3;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: #131a26;
      border: 1px solid #232f43;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    h2 { margin: 0 0 6px; font-size: 1.35rem; }
    p { margin: 0 0 16px; color: #8b9bb4; font-size: 0.9rem; }
    textarea {
      width: 100%;
      height: 100px;
      background: #0b0f17;
      color: #f0f6fc;
      border: 1px solid #2b3a52;
      border-radius: 12px;
      padding: 12px;
      font-size: 1rem;
      resize: none;
      outline: none;
    }
    textarea:focus { border-color: #4f8cff; }
    .oled-preview {
      margin-top: 10px;
      padding: 8px 12px;
      background: #070a0f;
      border: 1px dashed #2e405c;
      border-radius: 10px;
      font-family: monospace;
      font-size: 0.85rem;
      color: #93c5fd;
    }
    .quick-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0 18px;
    }
    .tag {
      background: #1b2536;
      border: 1px solid #2c3b54;
      color: #c9d6ea;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .tag:hover { background: #243249; }
    button.send-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #4f8cff, #7c5cff);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .status {
      margin-top: 14px;
      font-size: 0.85rem;
      color: #5eead4;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>🎭 FaceMood Dashboard</h2>
    <p>ফেসের এক্সপ্রেশন ও নিচের মেসেজ দুটোই একসাথে আপডেট হবে।</p>

    <textarea id="msgInput" oninput="updatePreview()" placeholder="যেমন: অনেক মিস করছি... অথবা খুব ভালোবাসি!"></textarea>
    <div class="oled-preview" id="oledPreview">OLED Text: (empty)</div>

    <div class="quick-tags">
      <span class="tag" onclick="setText('অনেক মিস করছি')">😢 Miss You</span>
      <span class="tag" onclick="setText('খুব ভালোবাসি')">😍 Love</span>
      <span class="tag" onclick="setText('হাসছি তো!')">😄 Happy</span>
      <span class="tag" onclick="setText('রাগ করো না, সরি')">🥺 Sorry</span>
      <span class="tag" onclick="setText('একটু রাগ লাগছে')">😠 Grumpy</span>
      <span class="tag" onclick="setText('চমক আছে!')">🤩 Wow</span>
    </div>

    <button class="send-btn" onclick="sendMood()">Send to Home Face</button>
    <div class="status" id="statusText"></div>
  </div>

  <script>
    const DB_URL = "https://facemoodbox-default-rtdb.firebaseio.com";

    const bnMap = {
      "অ":"o","আ":"a","ই":"i","ঈ":"ee","উ":"u","ঊ":"oo","ঋ":"ri","এ":"e","ঐ":"oi","ও":"o","ঔ":"ou",
      "ক":"k","খ":"kh","গ":"g","ঘ":"gh","ঙ":"ng","চ":"ch","ছ":"chh","জ":"j","ঝ":"jh","ঞ":"n",
      "ট":"t","ঠ":"th","ড":"d","ঢ":"dh","ণ":"n","ত":"t","থ":"th","দ":"d","ধ":"dh","ন":"n",
      "প":"p","ফ":"f","ব":"b","ভ":"bh","ম":"m","য":"j","র":"r","ল":"l","শ":"sh","ষ":"sh",
      "স":"s","হ":"h","ড়":"r","ঢ়":"rh","য়":"y","ৎ":"t","ং":"ng","ঃ":"h","ঁ":"",
      "া":"a","ি":"i","ী":"ee","ু":"u","ূ":"oo","ৃ":"ri","ে":"e","ৈ":"oi","ো":"o","ৌ":"ou","্":""
    };

    function toOledText(input) {
      let out = "";
      for (const ch of input) {
        if (bnMap[ch] !== undefined) out += bnMap[ch];
        else if (ch.charCodeAt(0) < 128) out += ch;
      }
      return out.replace(/\s+/g, " ").trim().slice(0, 21);
    }

    function updatePreview() {
      const raw = document.getElementById("msgInput").value;
      const clean = toOledText(raw);
      document.getElementById("oledPreview").textContent =
        "OLED Text: " + (clean ? `"${clean}"` : "(empty)");
    }

    function setText(txt) {
      document.getElementById("msgInput").value = txt;
      updatePreview();
    }

    function detectMood(text) {
      const t = text.toLowerCase();
      if (t.includes("miss") || t.includes("মিস")) return "sad";
      if (t.includes("love") || t.includes("ভালোবাস")) return "love";
      if (t.includes("sorry") || t.includes("সরি") || t.includes("রাগ করো না")) return "plead";
      if (t.includes("angry") || t.includes("রাগ") || t.includes("মন খারাপ")) return "angry";
      if (t.includes("wow") || t.includes("চমক") || t.includes("সারপ্রাইজ")) return "surprised";
      if (t.includes("happy") || t.includes("হাস") || t.includes("ভালো আছি")) return "happy";
      return "happy";
    }

    async function sendMood() {
      const rawText = document.getElementById("msgInput").value.trim();
      const statusEl = document.getElementById("statusText");
      if (!rawText) {
        statusEl.textContent = "আগে কিছু একটা লিখুন!";
        return;
      }

      const oledText = toOledText(rawText) || "Hello!";
      const mood = detectMood(rawText);
      const payload = {
        text: oledText,
        mood: mood,
        updatedAt: Date.now()
      };

      statusEl.textContent = "পাঠানো হচ্ছে...";
      try {
        const res = await fetch(`${DB_URL}/facemood.json`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        statusEl.textContent = res.ok
          ? `Sent! Mood: ${mood.toUpperCase()} | "${oledText}"`
          : "Firebase-এ পাঠাতে সমস্যা হয়েছে।";
      } catch (err) {
        statusEl.textContent = "নেটওয়ার্ক এরর! সংযোগ চেক করুন।";
      }
    }
  </script>
</body>
</html>
