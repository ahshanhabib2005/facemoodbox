<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FaceMood Remote Control</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0f17;
      color: #e6edf3;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: #131a26;
      border: 1px solid #232f43;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    h2 { margin: 0 0 6px; font-size: 1.3rem; }
    p { margin: 0 0 14px; color: #8b9bb4; font-size: 0.88rem; }
    textarea {
      width: 100%;
      height: 82px;
      background: #0b0f17;
      color: #f0f6fc;
      border: 1px solid #2b3a52;
      border-radius: 12px;
      padding: 11px;
      font-size: 1rem;
      resize: none;
      outline: none;
    }
    textarea:focus { border-color: #4f8cff; }
    .oled-preview {
      margin-top: 8px;
      padding: 8px 12px;
      background: #070a0f;
      border: 1px dashed #2e405c;
      border-radius: 10px;
      font-family: monospace;
      font-size: 0.82rem;
      color: #93c5fd;
    }
    .section-title {
      margin: 14px 0 8px;
      font-size: 0.82rem;
      color: #9fb0c7;
      font-weight: 600;
    }
    .emoji-panel {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .emoji-card {
      background: #182233;
      border: 1px solid #2a3a54;
      border-radius: 12px;
      padding: 8px 4px;
      color: #e2e8f0;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .emoji-card:hover {
      background: #22314a;
      border-color: #4f8cff;
    }
    .emoji-card span.em { font-size: 1.35rem; line-height: 1.1; }
    .emoji-card span.lbl { font-size: 0.7rem; color: #9fb0c7; }
    .phrase-list {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 16px;
    }
    .phrase-chip {
      background: #172030;
      border: 1px solid #283852;
      color: #dbe6f5;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .phrase-chip:hover {
      background: #223149;
      border-color: #6b9aff;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    button.send-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #4f8cff, #7c5cff);
      color: #fff;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.clear-btn {
      padding: 12px 14px;
      border: 1px solid #33435e;
      border-radius: 12px;
      background: #182232;
      color: #cbd5e1;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .status {
      margin-top: 12px;
      font-size: 0.84rem;
      color: #5eead4;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>🎭 FaceMood Dashboard</h2>
    <p>ইমোজি বা নতুন লেখা বেছে নিয়ে পাঠান—ডিসপ্লে সেই মতো রিয়াকশন দেবে।</p>

    <textarea id="msgInput" oninput="updatePreview()" placeholder="মেসেজ লিখুন বা নিচের লেখা/ইমোজি চাপুন..."></textarea>
    <div class="oled-preview" id="oledPreview">OLED Text: (empty) | Face: IDLE</div>

    <div class="section-title">ফেস রিয়াকশন ইমোজি</div>
    <div class="emoji-panel" id="emojiPanel"></div>

    <div class="section-title">নতুন কুইক মেসেজ ও লেখা</div>
    <div class="phrase-list" id="phraseList"></div>

    <div class="actions">
      <button class="send-btn" onclick="sendMood()">Send to Home Face</button>
      <button class="clear-btn" onclick="clearInput()">Clear</button>
    </div>
    <div class="status" id="statusText"></div>
  </div>

  <script>
    const DB_URL = "https://facemoodbox-default-rtdb.firebaseio.com";

    const REACTION_EMOJIS = [
      { em: "😄", label: "Happy", mood: "happy", sample: "Haschhi to!" },
      { em: "😍", label: "Love", mood: "love", sample: "I love you" },
      { em: "😢", label: "Sad", mood: "sad", sample: "Khube miss korchi" },
      { em: "🥺", label: "Sorry", mood: "plead", sample: "Raag koro na, sorry" },
      { em: "😠", label: "Angry", mood: "angry", sample: "Ekdom raag lagche" },
      { em: "🤩", label: "Wow", mood: "surprised", sample: "Boro chomok ache!" },
      { em: "😉", label: "Wink", mood: "wink", sample: "Bujhso to naki?" },
      { em: "😎", label: "Cool", mood: "cool", sample: "Ekdom chill achi" },
      { em: "🤔", label: "Think", mood: "thinking", sample: "Tomar kotha bhabchi" },
      { em: "😴", label: "Sleep", mood: "sleep", sample: "Ghumiye poro ebar" },
      { em: "🙂", label: "Normal", mood: "idle", sample: "Kemon acho?" },
      { em: "❤️", label: "Heart", mood: "love", sample: "Sob somoy pashe achi" }
    ];

    const QUICK_PHRASES = [
      { text: "Kaj sas koira sms dio?", mood: "happy" },
      { text: "Kaj ay galam?", mood: "happy" },
      { text: "Tried naki?", mood: "idle" },
      { text: "kutta?", mood: "angry" },
      { text: "kamina?", mood: "angry" },
      { text: "Tarki?", mood: "idle" },
      { text: "Khawa daowa hoise?", mood: "idle" },
      { text: "Time moto ghumiye poro", mood: "sleep" },
      { text: "Tomake khub bhalobashi", mood: "love" },
      { text: "Mon kharap korona jaan", mood: "plead" },
      { text: "Kaj sesh kore call dio", mood: "thinking" },
      { text: "Nijer jotno nio", mood: "love" },
      { text: "Abar raag korla keno?", mood: "angry" },
      { text: "Good night, sweet dreams", mood: "sleep" },
      { text: "Good morning, pakhi", mood: "idle" },
    ];

    const bnMap = {
      "অ":"o","আ":"a","ই":"i","ঈ":"ee","উ":"u","ঊ":"oo","ঋ":"ri","এ":"e","ঐ":"oi","ও":"o","ঔ":"ou",
      "ক":"k","খ":"kh","গ":"g","ঘ":"gh","ঙ":"ng","চ":"ch","ছ":"chh","জ":"j","ঝ":"jh","ঞ":"n",
      "ট":"t","ঠ":"th","ড":"d","ঢ":"dh","ণ":"n","ত":"t","থ":"th","দ":"d","ধ":"dh","ন":"n",
      "প":"p","ফ":"f","ব":"b","ভ":"bh","ম":"m","য":"j","র":"r","ল":"l","শ":"sh","ষ":"sh",
      "স":"s","হ":"h","ড়":"r","ঢ়":"rh","য়":"y","ৎ":"t","ং":"ng","ঃ":"h","ঁ":"",
      "া":"a","ি":"i","ী":"ee","ু":"u","ূ":"oo","ৃ":"ri","ে":"e","ৈ":"oi","ো":"o","ৌ":"ou","্":""
    };

    function renderPanel() {
      const panel = document.getElementById("emojiPanel");
      panel.innerHTML = "";
      REACTION_EMOJIS.forEach(item => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "emoji-card";
        btn.innerHTML = `<span class="em">${item.em}</span><span class="lbl">${item.label}</span>`;
        btn.onclick = () => {
          const ta = document.getElementById("msgInput");
          ta.value = item.sample;
          ta.dataset.forcedMood = item.mood;
          updatePreview();
        };
        panel.appendChild(btn);
      });

      const phraseEl = document.getElementById("phraseList");
      phraseEl.innerHTML = "";
      QUICK_PHRASES.forEach(p => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "phrase-chip";
        chip.textContent = p.text;
        chip.onclick = () => {
          const ta = document.getElementById("msgInput");
          ta.value = p.text;
          ta.dataset.forcedMood = p.mood;
          updatePreview();
        };
        phraseEl.appendChild(chip);
      });
    }

    function toOledText(input) {
      let out = "";
      for (const ch of input) {
        if (bnMap[ch] !== undefined) out += bnMap[ch];
        else if (ch.charCodeAt(0) < 128) out += ch;
      }
      return out.replace(/\s+/g, " ").trim().slice(0, 120);
    }

    function detectMood(text) {
      const forced = document.getElementById("msgInput").dataset.forcedMood;
      if (forced) return forced;

      for (const item of REACTION_EMOJIS) {
        if (text.includes(item.em)) return item.mood;
      }
      const t = text.toLowerCase();
      if (t.includes("sleep") || t.includes("ঘুম") || t.includes("night")) return "sleep";
      if (t.includes("wink") || t.includes("চোখ টিপ")) return "wink";
      if (t.includes("cool") || t.includes("chill")) return "cool";
      if (t.includes("think") || t.includes("ভাব") || t.includes("call")) return "thinking";
      if (t.includes("miss") || t.includes("মিস") || t.includes("sad") || t.includes("কান্না")) return "sad";
      if (t.includes("love") || t.includes("ভালোবাস") || t.includes("bhalobash") || t.includes("jotno")) return "love";
      if (t.includes("sorry") || t.includes("সরি") || t.includes("রাগ করো না") || t.includes("mon kharap")) return "plead";
      if (t.includes("angry") || t.includes("রাগ") || t.includes("raag")) return "angry";
      if (t.includes("wow") || t.includes("চমক") || t.includes("সারপ্রাইজ") || t.includes("surprise")) return "surprised";
      if (t.includes("happy") || t.includes("হাস") || t.includes("ভালো আছি") || t.includes("firbo")) return "happy";
      return "happy";
    }

    function updatePreview() {
      const ta = document.getElementById("msgInput");
      const raw = ta.value.trim();
      if (!raw) {
        document.getElementById("oledPreview").textContent = "OLED Text: (empty) | Face: IDLE";
        return;
      }
      const clean = toOledText(raw) || "Hello!";
      const mood = detectMood(raw);
      document.getElementById("oledPreview").textContent =
        `OLED Text: "${clean}" | Face: ${mood.toUpperCase()}`;
    }

    function clearInput() {
      const ta = document.getElementById("msgInput");
      ta.value = "";
      delete ta.dataset.forcedMood;
      updatePreview();
    }

    document.getElementById("msgInput").addEventListener("input", () => {
      delete document.getElementById("msgInput").dataset.forcedMood;
    });

    async function sendMood() {
      const rawText = document.getElementById("msgInput").value.trim();
      const statusEl = document.getElementById("statusText");
      if (!rawText) {
        statusEl.textContent = "আগে কিছু একটা লিখুন বা লেখা/ইমোজি সিলেক্ট করুন!";
        return;
      }

      const oledText = toOledText(rawText) || "Hello!";
      const mood = detectMood(rawText);
      const payload = {
        text: oledText,
        mood: mood,
        updatedAt: Date.now()
      };

      statusEl.textContent = "পাঠানো হচ্ছে...";
      try {
        const res = await fetch(`${DB_URL}/facemood.json`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        statusEl.textContent = res.ok
          ? `Sent! Face: ${mood.toUpperCase()} | "${oledText}"`
          : "Firebase-এ পাঠাতে সমস্যা হয়েছে।";
      } catch (err) {
        statusEl.textContent = "নেটওয়ার্ক এরর! সংযোগ চেক করুন।";
      }
    }

    renderPanel();
    updatePreview();
  </script>
</body>
</html>
