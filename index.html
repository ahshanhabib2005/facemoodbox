<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FaceMood Live OLED Dashboard</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #070b12;
      color: #e6f1ff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .card {
      width: 100%;
      max-width: 500px;
      background: #0f1724;
      border: 1px solid #1e324d;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
    }
    h2 { margin: 0 0 4px; font-size: 1.25rem; color: #7dd3fc; }
    p { margin: 0 0 12px; color: #8da9c4; font-size: 0.85rem; }
    .oled-frame {
      background: #040811;
      border: 2px solid #1d3b5c;
      border-radius: 14px;
      padding: 10px 12px 12px;
      margin-bottom: 14px;
      box-shadow: inset 0 0 24px rgba(56, 189, 248, 0.08);
    }
    .oled-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.74rem;
      color: #38bdf8;
      margin-bottom: 8px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .live-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
      margin-right: 6px;
    }
    canvas#oledCanvas {
      width: 100%;
      height: auto;
      aspect-ratio: 128 / 64;
      display: block;
      background: #00040a;
      border: 1px solid #16324f;
      border-radius: 8px;
    }
    .oled-caption {
      margin-top: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.78rem;
      color: #7dd3fc;
      display: flex;
      justify-content: space-between;
      font-weight: 600;
    }
    textarea {
      width: 100%;
      height: 72px;
      background: #080e18;
      color: #e0f2fe;
      border: 1px solid #233c5c;
      border-radius: 12px;
      padding: 10px;
      font-size: 0.96rem;
      resize: none;
      outline: none;
    }
    textarea:focus { border-color: #38bdf8; }
    .section-title {
      margin: 12px 0 7px;
      font-size: 0.8rem;
      color: #7dd3fc;
      font-weight: 600;
    }
    .emoji-panel {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 7px;
      margin-bottom: 14px;
    }
    .emoji-btn {
      background: #111f33;
      border: 1px solid #223b59;
      border-radius: 10px;
      height: 38px;
      font-size: 1.25rem;
      color: #e2e8f0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .emoji-btn:hover { background: #172b47; border-color: #38bdf8; }
    .emoji-btn.selected { background: #19375c; border-color: #7dd3fc; }
    .actions { display: flex; gap: 10px; }
    button.send-btn {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #04101c;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }
    button.clear-btn {
      padding: 11px 14px;
      border: 1px solid #294669;
      border-radius: 12px;
      background: #101d2e;
      color: #bae6fd;
      font-size: 0.88rem;
      cursor: pointer;
    }
    .status {
      margin-top: 10px;
      font-size: 0.82rem;
      color: #38bdf8;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>FaceMood Dashboard</h2>
    <p>লাইভ ডিসপ্লেতে আপনার OLED-এর মতো লাইট-ব্লু ডিসপ্লে দেখা যাবে; কথার ভাব অনুযায়ী ফেস বদলাবে।</p>

    <div class="oled-frame">
      <div class="oled-header">
        <span><span class="live-dot"></span>LIVE OLED MONITOR</span>
        <span id="slotBadge">Clock (0-25s)</span>
      </div>
      <!-- 4x শার্প রেজোলিউশন (512x256) যাতে লেখা ঘোলা না হয় -->
      <canvas id="oledCanvas" width="512" height="256"></canvas>
      <div class="oled-caption">
        <span id="activeMoodTag">MOOD: IDLE</span>
        <span id="activeScreenTag">SCREEN: CLOCK</span>
      </div>
    </div>

    <textarea id="msgInput" oninput="onTextInput()" placeholder="SMS লিখুন অথবা নিচের ইমোজি চাপুন..."></textarea>

    <div class="section-title">ইমোজি (চাপলে সরাসরি ফুল-স্ক্রিন রিয়াকশন যাবে)</div>
    <div class="emoji-panel" id="emojiPanel"></div>

    <div class="actions">
      <button class="send-btn" onclick="sendMood()">Send to Home Face</button>
      <button class="clear-btn" onclick="clearInput()">Clear</button>
    </div>
    <div class="status" id="statusText"></div>
  </div>

  <script>
    const DB_URL = "https://facemoodbox-default-rtdb.firebaseio.com";
    const canvas = document.getElementById("oledCanvas");
    const ctx = canvas.getContext("2d");

    // 4x স্কেল (128x64 * 4 = 512x256)
    const S = 4;
    const OLED_BLUE = "#38bdf8";
    const OLED_BG = "#00040a";

    const EMOJIS = [
      { em: "😄", mood: "happy" },
      { em: "😍", mood: "love" },
      { em: "❤️", mood: "love" },
      { em: "😢", mood: "sad" },
      { em: "🥺", mood: "plead" },
      { em: "😠", mood: "angry" },
      { em: "🤩", mood: "surprised" },
      { em: "😉", mood: "wink" },
      { em: "😎", mood: "cool" },
      { em: "🤔", mood: "thinking" },
      { em: "😴", mood: "sleep" },
      { em: "🙂", mood: "idle" }
    ];

    const bnMap = {
      "অ":"o","আ":"a","ই":"i","ঈ":"ee","উ":"u","ঊ":"oo","ঋ":"ri","এ":"e","ঐ":"oi","ও":"o","ঔ":"ou",
      "ক":"k","খ":"kh","গ":"g","ঘ":"gh","ঙ":"ng","চ":"ch","ছ":"chh","জ":"j","ঝ":"jh","ঞ":"n",
      "ট":"t","ঠ":"th","ড":"d","ঢ":"dh","ণ":"n","ত":"t","থ":"th","দ":"d","ধ":"dh","ন":"n",
      "প":"p","ফ":"f","ব":"b","ভ":"bh","ম":"m","য":"j","র":"r","ল":"l","শ":"sh","ষ":"sh",
      "স":"s","হ":"h","ড়":"r","ঢ়":"rh","য়":"y","ৎ":"t","ং":"ng","ঃ":"h","ঁ":"",
      "া":"a","ি":"i","ী":"ee","ু":"u","ূ":"oo","ৃ":"ri","ে":"e","ৈ":"oi","ো":"o","ৌ":"ou","্":""
    };

    let selectedEmoji = null;
    let liveState = {
      mode: "auto",
      mood: "idle",
      text: "",
      until: 0
    };
    let bdWeather = { temp: "--C", desc: "BD Weather" };

    async function loadBdWeather() {
      try {
        const res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=23.8103&longitude=90.4125&current=temperature_2m,weather_code&timezone=Asia%2FDhaka");
        if (res.ok) {
          const d = await res.json();
          const t = Math.round(d.current.temperature_2m);
          const c = d.current.weather_code;
          let desc = "Weather";
          if (c === 0) desc = "Clear Sky";
          else if (c <= 3) desc = "Partly Cloudy";
          else if (c <= 48) desc = "Foggy";
          else if (c <= 57) desc = "Drizzle";
          else if (c <= 67) desc = "Rain";
          else if (c >= 95) desc = "Thunderstorm";
          bdWeather = { temp: `${t}C`, desc };
        }
      } catch (_) {}
    }

    function renderEmojis() {
      const panel = document.getElementById("emojiPanel");
      panel.innerHTML = "";
      EMOJIS.forEach(item => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "emoji-btn";
        btn.textContent = item.em;
        btn.onclick = () => {
          const ta = document.getElementById("msgInput");
          ta.value = item.em;
          selectedEmoji = item;
          highlightEmoji(btn);
        };
        panel.appendChild(btn);
      });
    }

    function highlightEmoji(activeBtn) {
      document.querySelectorAll(".emoji-btn").forEach(b => b.classList.remove("selected"));
      if (activeBtn) activeBtn.classList.add("selected");
    }

    function onTextInput() {
      const val = document.getElementById("msgInput").value;
      if (selectedEmoji && val !== selectedEmoji.em) {
        selectedEmoji = null;
        highlightEmoji(null);
      }
    }

    function toAsciiText(input) {
      let out = "";
      for (const ch of input) {
        const code = ch.charCodeAt(0);
        if (bnMap[ch] !== undefined) out += bnMap[ch];
        else if (code >= 32 && code < 127) out += ch;
      }
      return out.replace(/\s+/g, " ").trim().slice(0, 44);
    }

    function detectMoodFromText(text) {
      for (const item of EMOJIS) {
        if (text.includes(item.em)) return item.mood;
      }
      const t = text.toLowerCase();
      if (t.includes("love") || t.includes("ভালোবাস") || t.includes("bhalobash") || t.includes("valobash") || t.includes("prem") || t.includes("jaan") || t.includes("jan")) return "love";
      if (t.includes("angry") || t.includes("রাগ") || t.includes("raag") || t.includes("rag") || t.includes("birokto") || t.includes("mad")) return "angry";
      if (t.includes("sad") || t.includes("miss") || t.includes("মিস") || t.includes("কান্না") || t.includes("kanna") || t.includes("kosto") || t.includes("mon kharap")) return "sad";
      if (t.includes("sorry") || t.includes("সরি") || t.includes("plz") || t.includes("please") || t.includes("maaf")) return "plead";
      if (t.includes("wow") || t.includes("চমক") || t.includes("surprise") || t.includes("chomok") || t.includes("ki!") || t.includes("omg")) return "surprised";
      if (t.includes("sleep") || t.includes("ঘুম") || t.includes("ghum") || t.includes("night") || t.includes("raat")) return "sleep";
      if (t.includes("wink") || t.includes("চোখ টিপ") || t.includes("haha") || t.includes("hehe") || t.includes("maja")) return "wink";
      if (t.includes("cool") || t.includes("chill") || t.includes("smart") || t.includes("osthir")) return "cool";
      if (t.includes("think") || t.includes("ভাব") || t.includes("bhab") || t.includes("kotha") || t.includes("keno") || t.includes("kemon") || t.includes("?")) return "thinking";
      if (t.includes("happy") || t.includes("হাস") || t.includes("has") || t.includes("ভালো") || t.includes("valo") || t.includes("bhalo") || t.includes("khushi")) return "happy";
      return "happy";
    }

    function clearInput() {
      document.getElementById("msgInput").value = "";
      selectedEmoji = null;
      highlightEmoji(null);
    }

    async function sendMood() {
      const raw = document.getElementById("msgInput").value;
      const statusEl = document.getElementById("statusText");
      if (!raw.trim()) {
        statusEl.textContent = "আগে ইমোজি চাপুন অথবা SMS লিখুন!";
        return;
      }

      let payload;
      if (selectedEmoji) {
        payload = {
          type: "emoji",
          mood: selectedEmoji.mood,
          text: "",
          updatedAt: Date.now()
        };
      } else {
        const cleanText = toAsciiText(raw) || "Hello";
        const mood = detectMoodFromText(raw);
        payload = {
          type: "sms",
          mood: mood,
          text: cleanText,
          updatedAt: Date.now()
        };
      }

      statusEl.textContent = "ডিসপ্লেতে পাঠানো হচ্ছে...";
      try {
        const res = await fetch(`${DB_URL}/facemood.json`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          liveState = {
            mode: payload.type,
            mood: payload.mood,
            text: payload.text,
            until: Date.now() + 25000
          };
          statusEl.textContent = payload.type === "emoji"
            ? `Sent Emoji Face: ${payload.mood.toUpperCase()}`
            : `Sent SMS (${payload.mood.toUpperCase()}): "${payload.text}"`;
        } else {
          statusEl.textContent = "Firebase-এ পাঠাতে সমস্যা হয়েছে।";
        }
      } catch (err) {
        statusEl.textContent = "নেটওয়ার্ক এরর! সংযোগ চেক করুন।";
      }
    }

    function drawFullFaceOnCanvas(mood, now) {
      const lx = 34 * S, rx = 94 * S, cy = 26 * S;
      const blink = ((now % 3400) < 130) && mood !== "sleep" && mood !== "surprised";
      const h = (mood === "sleep" ? 3 : (mood === "surprised" ? 32 : (blink ? 3 : 28))) * S;

      ctx.fillStyle = OLED_BLUE;
      if (mood === "sleep") {
        ctx.fillRect(lx - 16 * S, cy, 32 * S, 3 * S);
        ctx.fillRect(rx - 16 * S, cy, 32 * S, 3 * S);
        ctx.strokeStyle = OLED_BLUE;
        ctx.lineWidth = 2 * S;
        ctx.beginPath(); ctx.arc(64 * S, 52 * S, 4 * S, 0, Math.PI * 2); ctx.stroke();
        ctx.font = `bold ${10 * S}px ui-monospace, monospace`;
        ctx.fillText("zZ", 110 * S, 13 * S - ((now / 450) % 5) * S);
        return;
      }

      if (mood === "wink") {
        ctx.fillRect(lx - 16 * S, cy - h / 2, 32 * S, h);
        if (h > 8 * S) {
          ctx.fillStyle = OLED_BG;
          ctx.beginPath(); ctx.arc(lx, cy, 5 * S, 0, Math.PI * 2); ctx.fill();
        }
        ctx.strokeStyle = OLED_BLUE; ctx.lineWidth = 2.5 * S;
        ctx.beginPath(); ctx.moveTo(rx - 15 * S, cy - 2 * S); ctx.lineTo(rx, cy + 5 * S); ctx.lineTo(rx + 15 * S, cy - 2 * S); ctx.stroke();
      } else {
        ctx.fillRect(lx - 16 * S, cy - h / 2, 32 * S, h);
        ctx.fillRect(rx - 16 * S, cy - h / 2, 32 * S, h);
        if (h > 8 * S) {
          const px = Math.sin(now / 900) * 4 * S;
          ctx.fillStyle = OLED_BG;
          ctx.beginPath(); ctx.arc(lx + px, cy, 5 * S, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(rx + px, cy, 5 * S, 0, Math.PI * 2); ctx.fill();
        }
      }

      ctx.strokeStyle = OLED_BLUE; ctx.lineWidth = 2.5 * S;
      if (mood === "angry" || mood === "sad" || mood === "plead") {
        const dir = mood === "angry" ? 5 * S : -3 * S;
        ctx.beginPath(); ctx.moveTo(lx - 15 * S, cy - 19 * S - dir); ctx.lineTo(lx + 14 * S, cy - 12 * S + dir); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(rx + 15 * S, cy - 19 * S - dir); ctx.lineTo(rx - 14 * S, cy - 12 * S + dir); ctx.stroke();
        ctx.beginPath(); ctx.arc(64 * S, 57 * S, 9 * S, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
      } else if (mood === "surprised") {
        ctx.beginPath(); ctx.arc(64 * S, 53 * S, 5 * S, 0, Math.PI * 2); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.arc(64 * S, 48 * S, 10 * S, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
      }
    }

    function drawSmallBubbleOnCanvas(mood, msg) {
      ctx.fillStyle = OLED_BLUE;
      ctx.fillRect(6 * S, 22 * S, 12 * S, 9 * S);
      ctx.fillRect(22 * S, 22 * S, 12 * S, 9 * S);
      ctx.fillStyle = OLED_BG;
      ctx.fillRect(11 * S, 25 * S, 3 * S, 3 * S);
      ctx.fillRect(27 * S, 25 * S, 3 * S, 3 * S);

      ctx.strokeStyle = OLED_BLUE; ctx.lineWidth = 1.8 * S;
      if (mood === "angry" || mood === "sad" || mood === "plead") {
        ctx.beginPath(); ctx.moveTo(6 * S, 16 * S); ctx.lineTo(17 * S, 19 * S); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(34 * S, 16 * S); ctx.lineTo(23 * S, 19 * S); ctx.stroke();
        ctx.beginPath(); ctx.arc(20 * S, 44 * S, 5 * S, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.arc(20 * S, 38 * S, 5 * S, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
      }

      ctx.fillStyle = OLED_BLUE;
      ctx.beginPath(); ctx.arc(40 * S, 34 * S, 2 * S, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(45 * S, 29 * S, 2 * S, 0, Math.PI * 2); ctx.fill();
      ctx.strokeRect(49 * S, 5 * S, 77 * S, 54 * S);

      ctx.fillStyle = OLED_BLUE;
      ctx.font = `bold ${8 * S}px ui-monospace, monospace`;
      ctx.textAlign = "left";
      const maxPerLine = 11;
      const lines = Math.min(4, Math.max(1, Math.ceil(msg.length / maxPerLine)));
      const startY = lines === 1 ? 35 : (lines === 2 ? 28 : 20);
      for (let i = 0; i < lines; i++) {
        const part = msg.slice(i * maxPerLine, (i + 1) * maxPerLine);
        ctx.fillText(part, 52 * S, (startY + i * 10) * S);
      }
    }

    function drawClockOnCanvas(nowObj) {
      let h24 = nowObj.getHours();
      const isPM = h24 >= 12;
      let h12 = h24 % 12;
      if (h12 === 0) h12 = 12;
      const hh = String(h12).padStart(2, "0");
      const mm = String(nowObj.getMinutes()).padStart(2, "0");
      const dateStr = nowObj.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });

      ctx.fillStyle = OLED_BLUE;
      ctx.font = `bold ${22 * S}px ui-monospace, monospace`;
      ctx.textAlign = "left";
      ctx.fillText(`${hh}:${mm}`, 12 * S, 38 * S);

      ctx.font = `bold ${8 * S}px ui-monospace, monospace`;
      ctx.fillText(isPM ? "PM" : "AM", 104 * S, 18 * S);

      ctx.textAlign = "center";
      ctx.font = `bold ${9 * S}px ui-monospace, monospace`;
      ctx.fillText(dateStr, 64 * S, 54 * S);
      ctx.textAlign = "left";
    }

    function drawWeatherOnCanvas() {
      ctx.fillStyle = OLED_BLUE;
      ctx.strokeStyle = OLED_BLUE;
      ctx.lineWidth = 1.5 * S;
      ctx.textAlign = "center";

      ctx.font = `bold ${8 * S}px ui-monospace, monospace`;
      ctx.fillText("BD WEATHER", 64 * S, 14 * S);

      ctx.beginPath();
      ctx.moveTo(12 * S, 18 * S);
      ctx.lineTo(116 * S, 18 * S);
      ctx.stroke();

      ctx.font = `bold ${16 * S}px ui-monospace, monospace`;
      ctx.fillText(bdWeather.temp, 64 * S, 39 * S);

      ctx.font = `bold ${8 * S}px ui-monospace, monospace`;
      ctx.fillText(bdWeather.desc, 64 * S, 54 * S);
      ctx.textAlign = "left";
    }

    function renderLoop() {
      const now = Date.now();
      const d = new Date(now);
      const sec = d.getSeconds();

      ctx.fillStyle = OLED_BG;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const overrideActive = now < liveState.until;
      let screenLabel = "";
      let moodLabel = liveState.mood.toUpperCase();

      if (overrideActive && liveState.mode === "sms") {
        drawSmallBubbleOnCanvas(liveState.mood, liveState.text);
        screenLabel = "SMS BUBBLE";
      } else if (overrideActive && liveState.mode === "emoji") {
        drawFullFaceOnCanvas(liveState.mood, now);
        screenLabel = "EMOJI FULL FACE";
      } else if (sec < 25) {
        drawClockOnCanvas(d);
        screenLabel = "12H CLOCK";
        moodLabel = "TIME";
      } else if (sec < 35) {
        drawWeatherOnCanvas();
        screenLabel = "BD WEATHER";
        moodLabel = "WEATHER";
      } else {
        const autoIdx = Math.floor(now / 4500) % EMOJIS.length;
        const autoMood = EMOJIS[autoIdx].mood;
        drawFullFaceOnCanvas(autoMood, now);
        screenLabel = "AUTO FACE";
        moodLabel = autoMood.toUpperCase();
      }

      document.getElementById("slotBadge").textContent =
        sec < 25 ? `Clock (${sec + 1}/25s)` : (sec < 35 ? `BD Weather (${sec - 24}/10s)` : `Faces (${sec - 34}/25s)`);
      document.getElementById("activeMoodTag").textContent = `MOOD: ${moodLabel}`;
      document.getElementById("activeScreenTag").textContent = `SCREEN: ${screenLabel}`;

      requestAnimationFrame(renderLoop);
    }

    renderEmojis();
    loadBdWeather();
    setInterval(loadBdWeather, 900000);
    renderLoop();
  </script>
</body>
</html>
